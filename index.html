<style>
  /* Layout: full-bleed 3D solar system; focus chips under the title, weapon dock at the bottom */
  :root{
    --void:#04050b;
    --glass:rgba(12,16,32,.66);
    --line:rgba(170,190,255,.18);
    --ink:#e8ecff;
    --dim:#9aa3c7;
    --signal:#7fd4ff;
    --flare:#ffb35c;
    --danger:#ff6b5a;
    --display:"Unbounded","Arial Black",system-ui,sans-serif;
    --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #gl.aim{cursor:crosshair;}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(16px,4.4vw,22px);letter-spacing:.02em;}
  .meter{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:2px;align-items:flex-end;}
  .meter b{color:var(--signal);font-weight:400;}
  .bar{pointer-events:auto;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;scrollbar-width:none;align-self:flex-start;}
  .bar::-webkit-scrollbar{display:none;}
  .bar[hidden]{display:none;}
  .bar button{font:600 13px var(--body);color:var(--dim);background:transparent;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;flex:none;}
  .bar button[aria-pressed="true"]{color:var(--void);background:var(--ink);}
  .bar button.act{color:var(--ink);}
  .bar button:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .row2{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .landWrap:has(button[hidden]){display:none;}
  .bar button.land{color:#1b0f00;background:var(--signal);}
  body.onground #focusBar{display:none;}
  body.onground #w-laser,body.onground #w-water,body.onground #w-look{display:none;}
  .bar .sep{width:1px;background:var(--line);margin:6px 2px;flex:none;}
  .weapons button[aria-pressed="true"]{background:var(--flare);color:#1b0f00;}
  .weapons button[data-tool="laser"][aria-pressed="true"],.weapons button[data-tool="hole"][aria-pressed="true"]{background:var(--danger);color:#1b0300;}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
  .dock .bar{align-self:center;}
  .caption{font-size:13px;color:var(--dim);text-align:center;max-width:52ch;line-height:1.45;min-height:1.45em;text-wrap:balance;}
  .toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(18px,5vw,30px);letter-spacing:.04em;color:var(--flare);text-shadow:0 0 24px rgba(255,140,60,.6);pointer-events:none;opacity:0;transition:opacity .4s ease;text-align:center;width:max-content;max-width:90vw;}
  .toast.on{opacity:1;}
  .fail[hidden]{display:none;}
  .fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--dim);font-size:15px;line-height:1.5;}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }
</style>
</head><body>

<canvas id="gl" aria-label="Space Land"></canvas>

<div class="top">
  <div class="row">
    <div class="brand"><h1 id="planetName">Space Land</h1></div>
    <div class="meter"><span><b id="fps">--</b> fps · <span id="res">--</span></span><span id="stat"></span></div>
  </div>
  <div class="row2">
    <div class="bar" id="focusBar" role="group" aria-label="Смотреть на"></div>
    <div class="bar landWrap"><button id="landBtn" type="button" class="act land" hidden>Высадиться</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="dock">
  <div class="caption" id="caption"></div>
  <div class="bar weapons" role="group" aria-label="Инструменты">
    <button id="w-look" type="button" data-tool="look" aria-pressed="true">Камера</button>
    <button id="w-rock" type="button" data-tool="rock" aria-pressed="false">Астероид</button>
    <button id="w-rain" type="button" data-tool="rain" aria-pressed="false">Метеоры</button>
    <button id="w-moon" type="button" data-tool="moon" aria-pressed="false">Луна</button>
    <button id="w-water" type="button" data-tool="water" aria-pressed="false">Вода</button>
    <button id="w-laser" type="button" data-tool="laser" aria-pressed="false">Лазер</button>
    <button id="w-hole" type="button" data-tool="hole" aria-pressed="false">Чёрная дыра</button>
    <span class="sep"></span>
    <button id="c-pause" type="button" class="act">Пауза</button>
    <button id="c-speed" type="button" class="act">×1</button>
    <button id="c-reset" type="button" class="act">Заново</button>
  </div>
</div>

<div class="fail" id="fail" hidden>Этому браузеру не хватает WebGL 2, поэтому показать космос не получится. Попробуй свежий Chrome, Edge или Safari.</div>

<script>
(() => {
const HINTS = {
  look: 'Тяни — вращать камеру, колёсико или щипок — приблизить. Тапни по планете, чтобы лететь к ней.',
  rock: 'Тапни по планете — прилетит астероид. По суше — кратер, по океану — цунами. Удары толкают планету, много ударов — и она развалится.',

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });

gl.getExtension('OES_texture_float_linear');

float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),

float fbm(vec3 p,int o){float a=.5,s=0.;for(int i=0;i<8;i++){if(i>=o)break;s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}

}

  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a));

function makeSphere(seg, rings){

    }

  const mid = {};
  const midpoint = (a, b) => {
    const k = a < b ? a + '_' + b : b + '_' + a;
    if (mid[k] !== undefined) return mid[k];
    const p = [(v[a][0] + v[b][0]) / 2, (v[a][1] + v[b][1]) / 2, (v[a][2] + v[b][2]) / 2];
    const l = Math.hypot(...p); v.push(p.map((c) => c / l)); mid[k] = v.length - 1; return mid[k];
  };
  const nf = [];

  for (const tri of f) for (const i of tri) pos.push(...v[i]);
  return new Float32Array(pos);
}

const laser = { on: false, hit: null, hx: 0, hy: 0, hz: 0, px: 0, py: 0, slotT: 0 };
function rayFrom(cx, cy){
  if (!C) return null;
  const rect = cvs.getBoundingClientRect();
  const nx = ((cx - rect.left) / rect.width) * 2 - 1, ny = 1 - ((cy - rect.top) / rect.height) * 2;
  const tt = Math.tan(FOVY / 2), asp = rect.width / rect.height;
  const L = C.L;
  let dx = L.f[0] + L.r[0] * nx * tt * asp + L.u[0] * ny * tt;
  let dy = L.f[1] + L.r[1] * nx * tt * asp + L.u[1] * ny * tt;
  let dz = L.f[2] + L.r[2] * nx * tt * asp + L.u[2] * ny * tt;
  const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
  return { o: C.e, d: [dx, dy, dz] };
}
function pick(ray){
  let best = null, bt = 1e9;
  for (const b of bodies){
    if (!b.alive) continue;
    const ox = ray.o[0] - b.x, oy = ray.o[1] - b.y, oz = ray.o[2] - b.z;
    const bb = ox * ray.d[0] + oy * ray.d[1] + oz * ray.d[2];
    const rr = b.kind === 'bh' ? b.R * 2 : b.R;
    const c = ox*ox + oy*oy + oz*oz - rr * rr;
    const h = bb * bb - c;
    if (h < 0) continue;
    const tt = -bb - Math.sqrt(h);
    if (tt > 0 && tt < bt){ bt = tt; best = b; }
  }
  if (!best) return null;
  return { b: best, x: ray.o[0] + ray.d[0] * bt, y: ray.o[1] + ray.d[1] * bt, z: ray.o[2] + ray.d[2] * bt };
}

let tool = 'look';
const pointers = new Map();
let pinch0 = 0, dist0 = 0, downT = 0, lastX = 0, lastY = 0, rotating = false, velYaw = 0, velPitch = 0, moved = 0, downBtn = 0;
function zoomLimits(){ const fp = focusPoint(); const r = fp ? fp[3] : 2; return [r * 1.25, 900]; }
function zoomBy(f){ const [lo, hi] = zoomLimits(); cam.dist = Math.max(lo, Math.min(hi, cam.dist * f)); }
cvs.addEventListener('wheel', (e) => { e.preventDefault(); if (surface.on) return; zoomBy(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

cvs.addEventListener('pointerdown', (e) => {
  try { cvs.setPointerCapture(e.pointerId); } catch (x) {}
  if (surface.on){ surfaceDown(e); return; }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.dist; rotating = false; laser.on = false;
    return;
  }
  lastX = e.clientX; lastY = e.clientY; downT = performance.now(); moved = 0; downBtn = e.button;
  if (tool === 'laser' && e.button === 0){ laser.on = true; laser.px = e.clientX; laser.py = e.clientY; rotating = false; }
  else rotating = tool === 'look' || e.button !== 0;
  velYaw = velPitch = 0;

cvs.addEventListener('pointermove', (e) => {
  if (surface.on){ surfaceMove(e); return; }
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0){ const [lo, hi] = zoomLimits(); cam.dist = Math.max(lo, Math.min(hi, dist0 * pinch0 / Math.max(10, d))); }
    return;
  }

  if (laser.on){ laser.px = e.clientX; laser.py = e.clientY; }

    const k = 3.4 / Math.max(300, Math.min(cvs.clientWidth, cvs.clientHeight));

function fireAt(cx, cy){
  const ray = rayFrom(cx, cy);
  if (!ray) return;
  const hit = pick(ray);
  if (tool === 'look'){ if (hit) focusOn(hit.b); return; }
  const p = hit ? [hit.x, hit.y, hit.z] : spacePoint(ray);
  const tb = hit ? hit.b : null;
  if (tool === 'rock') launch('rock', p[0], p[1], p[2], tb);
  else if (tool === 'moon') launch('moon', p[0], p[1], p[2], tb);
  else if (tool === 'water'){
    if (!tb || tb.kind === 'star' || tb.kind === 'bh'){ showToast('Тапни по планете'); return; }
    if (tb.kind === 'gas'){ showToast('У газового гиганта нет поверхности для океана'); return; }
    const base = tb.seaT > 0 ? tb.seaT : (STYLES[tb.style].kind === 0 ? 0.53 : 0.36);
    const max = STYLES[tb.style].kind === 0 ? 0.68 : 0.62;
    tb.seaT = Math.min(max, tb.seaT > 0 ? base + 0.03 : base);
    if (tb.sea === 0) tb.sea = Math.max(0.2, tb.seaT - 0.12);
    for (let k = 0; k < 70; k++){
      const e2 = C.e; const dx = e2[0] - p[0], dy = e2[1] - p[1], dz = e2[2] - p[2]; const l = Math.hypot(dx, dy, dz) || 1;
      const st = 1.5 + Math.random() * tb.R * 2;
      addPart(p[0] + dx / l * st + (Math.random() - .5) * tb.R, p[1] + dy / l * st + (Math.random() - .5) * tb.R, p[2] + dz / l * st + (Math.random() - .5) * tb.R, tb.vx - dx / l * 3, tb.vy - dy / l * 3, tb.vz - dz / l * 3, .12, .2, .4, 0.6 + Math.random() * 0.6);
    }
    showToast(tb.seaT >= max ? (tb.name + ': океан на максимуме') : (tb.name + ': воды больше'));
  }
  else if (tool === 'rain'){
    const off = tb ? tb.R * 0.7 : 1.5;
    for (let k = 0; k < 18; k++) rainQueue.push({ at: k * 0.07, x: p[0] + (Math.random() - .5) * off, y: p[1] + (Math.random() - .5) * off, z: p[2] + (Math.random() - .5) * off, b: tb });
  } else if (tool === 'hole'){
    const base = cam.focus && cam.focus.alive ? cam.focus : null;
    let hx = p[0], hy = p[1], hz = p[2];
    if (hit){ const dx = C.e[0] - hit.x, dy = C.e[1] - hit.y, dz = C.e[2] - hit.z; const l = Math.hypot(dx, dy, dz) || 1; const off = Math.min(hit.b.R * 4 + 4, l * 0.7); hx = hit.x + dx / l * off; hy = hit.y + dy / l * off; hz = hit.z + dz / l * off; }
    newBody({ name: 'Чёрная дыра', fem: true, kind: 'bh', style: 'bh', x: hx, y: hy, z: hz, vx: base ? base.vx : 0, vy: 0, vz: base ? base.vz : 0, m: 3000, R: 1.2, spin: 0, tilt: 0 });
    flashes.push({ x: hx, y: hy, z: hz, s: 3, life: 1, c: [.5, .35, 1] });
    showToast('Появилась чёрная дыра');
    renderFocusBar();
  }
}

function laserTick(dt){
  if (!laser.on){ laser.hit = null; return; }
  const ray = rayFrom(laser.px, laser.py);
  if (!ray) return;
  const hit = pick(ray);
  if (!hit){ laser.hit = null; laser.hx = ray.o[0] + ray.d[0] * cam.dist * 3; laser.hy = ray.o[1] + ray.d[1] * cam.dist * 3; laser.hz = ray.o[2] + ray.d[2] * cam.dist * 3; return; }
  laser.hit = hit.b; laser.hx = hit.x; laser.hy = hit.y; laser.hz = hit.z;
  const b = hit.b;
  if (b.kind === 'star' || b.kind === 'bh') return;
  laser.slotT -= dt;
  const nx = (hit.x - b.x) / b.R, ny = (hit.y - b.y) / b.R, nz = (hit.z - b.z) / b.R;
  if (laser.slotT <= 0){
    laser.slotT = 0.09;
    const before = b.hp;
    applyImpact(b, hit.x, hit.y, hit.z, 6 + b.R * 2, 1.3);
    if (b.alive) b.hp = before;
  }
  if (!b.alive) return;
  b.hp -= dt / (5 * Math.sqrt(b.m / 40) + 1.5);
  for (let k = 0; k < 6; k++) addPart(hit.x, hit.y, hit.z, b.vx + (nx + (Math.random() - .5) * 1.4) * 4, b.vy + (ny + (Math.random() - .5) * 1.4) * 4, b.vz + (nz + (Math.random() - .5) * 1.4) * 4, 2.2, 1, .45, 0.5 + Math.random() * 0.6);
  shake = Math.min(0.25, shake + dt * 0.4);
  if (b.hp <= 0) shatter(b, nx, ny, nz, b.m * 3);
}

  if (l < 1e-4){ ex = 1; ey = 0; ez = 0; l = 1; }

  moon: { sand: [.6, .6, .6], low: [.5, .5, .52], high: [.44, .44, .46], rock: [.34, .34, .36], snow: [.7, .7, .72] }

function buildTerrain(){

  const sea = b.sea || 0;
  surface.hasWater = sea > 0;
  const e0 = heightAt(b, surface.site);

  for (let k = 0; k < H.length; k++) H[k] += shift;

  const pal = TERR_COL[b.style] || TERR_COL.moon;
  const pos = [], nor = [], col = [];
  const tri = (a, bb, c, colr) => {
    const ux = bb[0] - a[0], uy = bb[1] - a[1], uz = bb[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;

    else if (h > 24) c = pal.snow;
    else if (slope < 0.8) c = pal.rock;

    const hA = (p00[1] + p10[1] + p11[1]) / 3, hB = (p00[1] + p11[1] + p01[1]) / 3;
    const ja = 0.9 + hashN(i, j, 1) * 0.2, jb = 0.9 + hashN(i, j, 2) * 0.2;
    const sa = slopeOf(p00, p10, p11), sb = slopeOf(p00, p11, p01);

    let placed = 0;

      const x = (hashN(k, 3, 7) - 0.5) * 220, z = (hashN(k, 9, 1) - 0.5) * 220;
      const h = heightAtLocal(x, z);
      if (h < 2.5 || h > 20 || Math.hypot(x, z) < 8) continue;
      placed++;
      const th = 6 + hashN(k, 1, 1) * 5, tr = 0.5;
      const trunkC = [.35, .24, .14], leafC = [.14 + hashN(k, 2, 2) * .06, .32 + hashN(k, 4, 4) * .08, .12];
      for (let s = 0; s < 5; s++){

        const q2 = [q1[0], h + th * 0.4, q1[2]], q3 = [q0[0], h + th * 0.4, q0[2]];

      }
      for (let layer = 0; layer < 2; layer++){
        const rr = 3.2 - layer * 0.9, y0 = h + th * (0.3 + layer * 0.3), y1 = h + th * (0.8 + layer * 0.25);
        for (let s = 0; s < 6; s++){

    const x0 = -wh + i * WS, z0 = -wh + j * WS;
    const a = [x0, 0, z0], bb = [x0 + WS, 0, z0], c = [x0 + WS, 0, z0 + WS], d = [x0, 0, z0 + WS];

function slopeOf(a, b, c){
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];

function sideTri(pos, nor, col, a, b, c, colr, cx, cz){
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];

function uploadMesh(pos, nor, col, old){

  gl.bindVertexArray(m.vao);
  [pos, nor, col].forEach((arr, k) => {

function heightAtLocal(x, z){
  const N = surface.N, S = surface.S, half = N * S / 2, H = surface.grid;
  if (!H) return 0;
  const fx = Math.max(0, Math.min(N - 0.001, (x + half) / S)), fz = Math.max(0, Math.min(N - 0.001, (z + half) / S));

const landBtn = document.getElementById('landBtn');
function canLand(b){ return b && b.alive && b.kind === 'rocky' && TERR_COL[b.style]; }
function refreshLandBtn(){
  if (!landBtn) return;
  if (surface.on){ landBtn.hidden = false; landBtn.textContent = 'В космос'; return; }
  landBtn.hidden = !canLand(cam.focus);
  landBtn.textContent = 'Высадиться';
}
function land(){
  const b = cam.focus;
  if (!canLand(b)) return;
  const e = camEye();
  let dx = e[0] - b.x, dy = e[1] - b.y, dz = e[2] - b.z;
  const l = Math.hypot(dx, dy, dz) || 1;
  const o = toObj(b, dx / l, dy / l, dz / l);
  surface.planet = b; surface.site = o;
  surface.x = 0; surface.z = 0; surface.yaw = 0; surface.pitch = 0.12; surface.flash = 0; surface.tsunamiShown = 0;
  buildTerrain();
  const F = siteFrame();
  const sunB = bodies.find((q) => q.kind === 'star' && q.alive);
  if (sunB){ const sd = toLocal(F, [sunB.x - F.pos[0], sunB.y - F.pos[1], sunB.z - F.pos[2]]); surface.yaw = Math.atan2(sd[0], sd[2]) + 0.8; }
  surface.on = true;
  document.body.classList.add('onground');
  refreshLandBtn();
  setHeader();
  setTool(tool === 'laser' || tool === 'water' ? 'look' : tool);
  capEl.textContent = SURF_HINT;
  showToast(b.name + ': ты на поверхности');
}
function leave(msg){
  surface.on = false;
  document.body.classList.remove('onground');
  if (msg) showToast(msg);
  refreshLandBtn();
  setHeader();
  setTool(tool);
}
const SURF_HINT = 'WASD или левая половина экрана — идти, мышь или правая половина — смотреть. Кнопки «Астероид», «Метеоры», «Луна» бьют по планете рядом с тобой.';

function surfaceImpactNear(b, o, E){
  if (!surface.on || b !== surface.planet) return;
  const s = surface.site;
  const ang = Math.acos(Math.max(-1, Math.min(1, s[0] * o[0] + s[1] * o[1] + s[2] * o[2])));
  if (ang < 0.035 && E > 5){ surface.flash = 3; shake = 1; setTimeout(() => { if (surface.on) leave('Прямое попадание'); }, 700); return; }
  if (ang > 1.4) return;
  const k = Math.min(2.5, Math.sqrt(E) * 0.08 / (ang * 8 + 0.2));
  if (k > surface.flash){
    surface.flash = k;
    const F = siteFrame();
    const w = objToWorld(b, o);
    const d = toLocal(F, [w[0] - F.up[0], w[1] - F.up[1], w[2] - F.up[2]]);
    const l = Math.hypot(d[0], d[2]) || 1;
    surface.flashDir = [d[0] / l * 0.97, 0.24, d[2] / l * 0.97];
  }
  if (ang < 0.25) shake = Math.min(1, shake + k * 0.3);
}
function surfaceShoot(type){
  const b = surface.planet;
  if (!b || !b.alive) return;
  const F = siteFrame();
  const fwd = [Math.sin(surface.yaw), 0, Math.cos(surface.yaw)];
  const ang = 0.08 + Math.random() * 0.25;
  const side = (Math.random() - 0.5) * 0.6;
  const lx = fwd[0] + fwd[2] * side, lz = fwd[2] - fwd[0] * side;
  const ll = Math.hypot(lx, lz) || 1;
  const tl = [lx / ll * Math.sin(ang), Math.cos(ang), lz / ll * Math.sin(ang)];
  const tw = fromLocal(F, tl);
  const tx = b.x + tw[0] * b.R, ty = b.y + tw[1] * b.R, tz = b.z + tw[2] * b.R;
  const from = fromLocal(F, [-fwd[0] * 0.3 + (Math.random() - .5) * .4, 1, -fwd[2] * 0.3]);
  if (type === 'rain'){
    for (let k = 0; k < 18; k++) rainQueue.push({ at: k * 0.08, x: tx + (Math.random() - .5) * b.R * .5, y: ty + (Math.random() - .5) * b.R * .5, z: tz + (Math.random() - .5) * b.R * .5, b, from });
  } else launch(type, tx, ty, tz, b, from);
}

  if (surface.look && surface.look.id === e.pointerId){
    const k = 3 / Math.max(300, Math.min(cvs.clientWidth, cvs.clientHeight));
    const dx = e.clientX - surface.look.x, dy = e.clientY - surface.look.y;
    surface.look.moved += Math.abs(dx) + Math.abs(dy);
    surface.yaw -= dx * k; surface.pitch = Math.max(-1.3, Math.min(1.45, surface.pitch + dy * k));
    surface.look.x = e.clientX; surface.look.y = e.clientY;
  }
}
function surfaceUp(e){
  if (surface.stick && surface.stick.id === e.pointerId){ surface.stick = null; return; }
  if (surface.look && surface.look.id === e.pointerId){
    const quick = surface.look.moved < 10 && performance.now() - surface.look.t < 600;
    surface.look = null;
    if (quick && (tool === 'rock' || tool === 'rain' || tool === 'moon')) surfaceShoot(tool);
    if (quick && tool === 'hole'){
      const b = surface.planet; const F = siteFrame();
      const d = fromLocal(F, [Math.sin(surface.yaw) * .7, .7, Math.cos(surface.yaw) * .7]);
      newBody({ name: 'Чёрная дыра', fem: true, kind: 'bh', style: 'bh', x: F.pos[0] + d[0] * 40, y: F.pos[1] + d[1] * 40, z: F.pos[2] + d[2] * 40, vx: b.vx, vy: b.vy, vz: b.vz, m: 3000, R: 1.2, spin: 0, tilt: 0 });
      showToast('Появилась чёрная дыра');
    }
  }
}

function surfaceTick(dt){
  const b = surface.planet;
  if (!b || !b.alive){ leave((b ? b.name : 'Планета') + (b && b.fem ? ' разрушена' : ' разрушен')); return; }
  const K = surface.keys;
  let fx = 0, fz = 0;
  if (K.KeyW || K.ArrowUp) fz += 1;
  if (K.KeyS || K.ArrowDown) fz -= 1;
  if (K.KeyA || K.ArrowLeft) fx -= 1;
  if (K.KeyD || K.ArrowRight) fx += 1;
  if (surface.stick){ fx += Math.max(-1, Math.min(1, surface.stick.dx / 60)); fz += Math.max(-1, Math.min(1, -surface.stick.dy / 60)); }
  const sp = (K.ShiftLeft ? 14 : 7) * dt;
  const sy = Math.sin(surface.yaw), cy = Math.cos(surface.yaw);
  surface.x += (sy * fz - cy * fx) * sp;
  surface.z += (cy * fz + sy * fx) * sp;
  const r = Math.hypot(surface.x, surface.z);
  if (r > 160){ surface.x *= 160 / r; surface.z *= 160 / r; }
  const g = heightAtLocal(surface.x, surface.z);
  surface.y = Math.max(g, surface.hasWater ? surface.level - 0.4 : -1e9) + 1.7;
  surface.flash = Math.max(0, surface.flash - dt * 0.9);
  let rise = 0;
  const s = surface.site;
  for (let k = 0; k < 4; k++){
    const age = b.wv[k * 4 + 3];
    if (age < 0) continue;
    const d = Math.acos(Math.max(-1, Math.min(1, s[0] * b.wv[k * 4] + s[1] * b.wv[k * 4 + 1] + s[2] * b.wv[k * 4 + 2])));
    const front = age * 0.32;
    rise += Math.exp(-Math.pow((d - front) / 0.06, 2)) * Math.exp(-age * 0.2) * 14;
  }
  surface.level = rise;
  if (rise > 3 && performance.now() - surface.tsunamiShown > 6000){ surface.tsunamiShown = performance.now(); showToast('Цунами!'); }
}

function drawSurface(t){
  const b = surface.planet;
  const F = siteFrame();
  const sunB = bodies.find((q) => q.kind === 'star' && q.alive);
  let sunL = [0, -1, 0];
  if (sunB){ const d = toLocal(F, [sunB.x - F.pos[0], sunB.y - F.pos[1], sunB.z - F.pos[2]]); const l = Math.hypot(...d) || 1; sunL = [d[0] / l, d[1] / l, d[2] / l]; }
  const sunVis = sunB ? 1 : 0;
  const day = Math.max(0, Math.min(1, (sunL[1] + 0.12) / 0.37)) * sunVis;
  const warm = Math.exp(-Math.abs(sunL[1]) * 5);
  const sunC = [(1.6 + warm * .2) * sunVis * Math.max(0, Math.min(1, sunL[1] * 6 + 0.3)), (1.45 - warm * .6) * sunVis * Math.max(0, Math.min(1, sunL[1] * 6 + 0.3)), (1.25 - warm * 1) * sunVis * Math.max(0, Math.min(1, sunL[1] * 6 + 0.3))];
  const amb = [0.03 + day * 0.28, 0.035 + day * 0.36, 0.06 + day * 0.5];
  const fog = [0.02 + day * 0.5 + warm * day * 0.2, 0.025 + day * 0.64, 0.05 + day * 0.85];
  const ex = shake > 0 ? (Math.random() - .5) * shake * 0.6 : 0, ey2 = shake > 0 ? (Math.random() - .5) * shake * 0.6 : 0;
  const eye = [surface.x + ex, surface.y + ey2, surface.z];
  const cp = Math.cos(surface.pitch);
  const f = [Math.sin(surface.yaw) * cp, Math.sin(surface.pitch), Math.cos(surface.yaw) * cp];
  const L = lookAt(eye, [eye[0] + f[0], eye[1] + f[1], eye[2] + f[2]]);
  const Pm = persp(1.1, W / H, 0.3, 2000);
  const VP = mul(Pm, L.m);
  const Vr = L.m.slice(); Vr[12] = 0; Vr[13] = 0; Vr[14] = 0;
  const VPr = mul(persp(1.1, W / H, 0.5, 5000), Vr);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb.ms ? fb.ms.f : fb.scene.f);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);

  const bd = new Float32Array(40), bc = new Float32Array(40), bl = new Float32Array(40);
  let bn = 0;
  const flashDirWorld = surface.flashDir;
  for (const q of bodies){
    if (!q.alive || q === b || bn >= 10) continue;
    const d = [q.x - F.pos[0], q.y - F.pos[1], q.z - F.pos[2]];
    const dist = Math.hypot(...d);
    const ld = toLocal(F, [d[0] / dist, d[1] / dist, d[2] / dist]);
    const ar = Math.min(q.kind === 'star' ? 0.045 : 0.09, Math.max(q.kind === 'star' ? 0.02 : 0.0035, Math.atan((q.kind === 'bh' ? q.R * 1.5 : q.R) / dist)));
    const st = STYLES[q.style];
    let col = [1, .95, .85];
    if (q.kind === 'star') col = [1.2, .95, .7];
    else if (q.kind === 'bh') col = [0, 0, 0];
    else if (st){ col = q.style === 'earth' ? [.35, .5, .8] : (q.style === 'moon' ? [.7, .7, .7] : [st.a[0] * .6 + st.b[0] * .4, st.a[1] * .6 + st.b[1] * .4, st.a[2] * .6 + st.b[2] * .4]); }
    let lt = [0, 1, 0];
    if (sunB && q.kind !== 'star'){ const sd = [sunB.x - q.x, sunB.y - q.y, sunB.z - q.z]; const sl = Math.hypot(...sd) || 1; lt = toLocal(F, [sd[0] / sl, sd[1] / sl, sd[2] / sl]); }
    bd.set([ld[0], ld[1], ld[2], ar], bn * 4);
    bc.set([col[0], col[1], col[2], q.kind === 'star' ? 1 : (q.kind === 'bh' ? 2 : 0)], bn * 4);
    bl.set([lt[0], lt[1], lt[2], 0], bn * 4);
    bn++;
  }
  const basis = new Float32Array([F.east[0], F.east[1], F.east[2], F.up[0], F.up[1], F.up[2], F.north[0], F.north[1], F.north[2]]);
  gl.useProgram(PS.sky.p);
  const u = PS.sky.u;
  gl.uniform2f(u.uR, W, H);
  gl.uniform3fv(u.uCr, L.r); gl.uniform3fv(u.uCu, L.u); gl.uniform3fv(u.uCf, L.f);
  gl.uniform1f(u.uTan, Math.tan(0.55)); gl.uniform1f(u.uAsp, W / H);
  gl.uniform3fv(u.uSunL, sunL); gl.uniform1f(u.uSunVis, sunVis);
  gl.uniformMatrix3fv(u.uBasis, false, basis);
  gl.uniform4fv(u.uBd, bd); gl.uniform4fv(u.uBc, bc); gl.uniform4fv(u.uBl, bl); gl.uniform1i(u.uBn, bn);
  gl.uniform4f(u.uFlash, flashDirWorld[0], flashDirWorld[1], flashDirWorld[2], surface.flash);
  gl.uniform3fv(u.uFog, fog);
  gl.bindVertexArray(fsVao); gl.drawArrays(gl.TRIANGLES, 0, 6);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  const pts = [];
  const push = (wx, wy, wz, r, g2, bb, a) => {
    const d = [wx - F.pos[0], wy - F.pos[1], wz - F.pos[2]];
    const dist = Math.hypot(...d);
    if (dist < 1e-3) return;
    const ld = toLocal(F, [d[0] / dist, d[1] / dist, d[2] / dist]);
    if (ld[1] < -0.02) return;
    pts.push(ld[0] * 1000, ld[1] * 1000, ld[2] * 1000, r, g2, bb, a);
  };
  const near2 = (b.R * 30) * (b.R * 30);
  for (const r of rocks){
    const dx = r.x - b.x, dy = r.y - b.y, dz = r.z - b.z;
    if (dx * dx + dy * dy + dz * dz > near2) continue;
    const inAtmo = Math.hypot(dx, dy, dz) < b.R * 1.4;
    if (inAtmo || r.heat > 0.3){
      for (let k = 0; k < 10; k++){ const f = 1 - k / 10; push(r.x - (r.vx - b.vx) * k * 0.004, r.y - (r.vy - b.vy) * k * 0.004, r.z - (r.vz - b.vz) * k * 0.004, 6 * f, 3 * f, 1 * f, 1); }
    }
    else push(r.x, r.y, r.z, .8, .75, .7, 1);
  }
  for (let i = 0; i < parts.n; i += 2){
    if (parts.life[i] === 0) continue;
    const i3 = i * 3;
    const dx = parts.pos[i3] - b.x, dy = parts.pos[i3 + 1] - b.y, dz = parts.pos[i3 + 2] - b.z;
    if (dx * dx + dy * dy + dz * dz > near2) continue;
    push(parts.pos[i3], parts.pos[i3 + 1], parts.pos[i3 + 2], parts.col[i3] * .8, parts.col[i3 + 1] * .8, parts.col[i3 + 2] * .8, 0.6);
  }
  if (pts.length){
    gl.useProgram(P.pt.p);
    gl.uniformMatrix4fv(P.pt.u.uVP, false, VPr); gl.uniform1f(P.pt.u.uPS, 2600);
    gl.bindBuffer(gl.ARRAY_BUFFER, ptV.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts), gl.DYNAMIC_DRAW);
    gl.bindVertexArray(ptV.vao); gl.drawArrays(gl.POINTS, 0, pts.length / 7);
  }
  gl.disable(gl.BLEND);

  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  const tu = PS.terr.u;
  gl.useProgram(PS.terr.p);
  gl.uniformMatrix4fv(tu.uVP, false, VP); gl.uniform1f(tu.uT, t);
  gl.uniform3fv(tu.uSunL, sunL); gl.uniform3fv(tu.uSunC, sunC); gl.uniform3fv(tu.uAmb, amb); gl.uniform3fv(tu.uFog, fog); gl.uniform3fv(tu.uCam, eye);
  gl.uniform4f(tu.uFlash, surface.flashDir[0], surface.flashDir[1], surface.flashDir[2], surface.flash * 0.6);
  gl.uniform1f(tu.uFogD, 0.0045);
  gl.uniform1i(tu.uWater, 0); gl.uniform1f(tu.uLevel, 0);
  gl.bindVertexArray(surface.terr.vao); gl.drawArrays(gl.TRIANGLES, 0, surface.terr.n);
  if (surface.hasWater){
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1i(tu.uWater, 1); gl.uniform1f(tu.uLevel, surface.level);
    gl.bindVertexArray(surface.water.vao); gl.drawArrays(gl.TRIANGLES, 0, surface.water.n);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(null);
  if (fb.ms){
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fb.ms.f);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fb.scene.f);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }
  post();
}

if (!PS && landBtn) landBtn.remove();
setup();
setTool('look');
resize();

let last = performance.now(), t = 0, frames = 0, fpsT = last, tuneT = last, statT = 0, trailT = 0;
function frame(now){
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += rdt;
  if (!rotating){
    cam.yaw += velYaw * rdt; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + velPitch * rdt));
    velYaw *= Math.pow(0.03, rdt); velPitch *= Math.pow(0.03, rdt);
  }
  if (!paused){
    const dt = rdt * speed;
    for (let k = rainQueue.length - 1; k >= 0; k--){ const q = rainQueue[k]; q.at -= dt; if (q.at <= 0){ launch('meteor', q.x, q.y, q.z, q.b && q.b.alive ? q.b : null, q.from); rainQueue.splice(k, 1); } }
    const sub = speed > 1 ? 8 : 4;
    for (let s = 0; s < sub; s++) physics(dt / sub);
    for (const b of bodies){
      if (!b.alive) continue;
      for (let k = 0; k < 16; k++){ const i = k * 4; if (b.ci[i] > 0) b.ci[i] = Math.max(0, b.ci[i] - dt * 0.12); }
      for (let k = 0; k < 4; k++){ const i = k * 4 + 3; if (b.wv[i] >= 0){ b.wv[i] += dt; if (b.wv[i] > 10) b.wv[i] = -1; } }
      if (b.sea !== b.seaT){ const d = b.seaT - b.sea; b.sea = Math.abs(d) < 0.0005 ? b.seaT : b.sea + d * Math.min(1, dt * 0.8); }
    }
    for (let k = flashes.length - 1; k >= 0; k--){ flashes[k].life -= dt * 1.4; if (flashes[k].life <= 0) flashes.splice(k, 1); }
    trailT += dt;
    if (trailT > 0.25){ trailT = 0; for (const b of bodies){ if (!b.alive || b.kind === 'star') continue; b.trail.push([b.x, b.y, b.z]); if (b.trail.length > 90) b.trail.shift(); } }
    laserTick(dt);
  }
  if (toastT > 0){ toastT -= rdt; if (toastT <= 0) toastEl.classList.remove('on'); }
  resize();
  if (surface.on){ surfaceTick(rdt); if (surface.on) drawSurface(t); else drawScene(t, rdt); }
  else drawScene(t, rdt);
  frames++;
  statT += rdt;
  if (statT > 0.5){ statT = 0; refreshStat(); }
  if (now - fpsT > 500){
    const fps = frames * 1000 / (now - fpsT);
    document.getElementById('fps').textContent = Math.round(fps);
    frames = 0; fpsT = now;
    if (now - tuneT > 2000){
      if (fps < 38){
        if (pixelScale > 0.6){ pixelScale = Math.max(0.6, pixelScale * 0.8); tuneT = now; }
        else if (bloomOn){ bloomOn = false; tuneT = now; }
      } else if (fps > 58 && pixelScale < maxPix){ pixelScale = Math.min(maxPix, pixelScale * 1.1); tuneT = now; }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
